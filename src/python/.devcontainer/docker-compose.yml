services:
  init:
    image: colonyos/colonies:v1.9.0
    volumes:
      - configuration:/configuration
      - ./init-entrypoint.sh:/init-entrypoint.sh
    entrypoint:
      ["/bin/sh", "-c", "chmod +x /init-entrypoint.sh && /init-entrypoint.sh"]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    hostname: timescaledb
    environment:
      POSTGRES_USER: colonies
      PGDATA: /var/lib/postgresql/data
      TZ: Europe/Stockholm
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - configuration:/configuration
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "source /configuration/postgres.env && docker-entrypoint.sh postgres",
      ]

  colonyos:
    image: colonyos/colonies:v1.9.0
    hostname: colonyos
    environment:
      COLONIES_SERVER_TLS: false
      COLONIES_SERVER_PORT: 50080
      COLONIES_SERVER_HOST: colonyos
      COLONIES_DB_HOST: timescaledb
      COLONIES_DB_USER: colonies
      TZ: Europe/Stockholm
    depends_on:
      - timescaledb
    volumes:
      - configuration:/configuration
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "source /configuration/colonyos.env && colonies server start --initdb",
      ]

  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      COLONIES_SERVER_TLS: false
      COLONIES_SERVER_PORT: 50080
      COLONIES_SERVER_HOST: colonyos
      COLONIES_COLONY_NAME: dev
      TZ: Europe/Stockholm
    volumes:
      - ../:/workspaces:cached
      - configuration:/configuration
    depends_on:
      - timescaledb
      - colonyos

volumes:
  timescaledb_data:
  configuration:
